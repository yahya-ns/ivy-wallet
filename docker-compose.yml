services:
  ivy-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ivy-wallet
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - DB_PATH=/data/ivy-wallet.db
    volumes:
      - ivy-data:/data

volumes:
  ivy-data:
    driver: local
