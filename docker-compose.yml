services:
  # Ivy Wallet Web Application
  ivy-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ivy-wallet
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Database engine: sqlite (default), postgres, or mariadb
      - DB_TYPE=sqlite
      - DATA_DIR=/data
      - DB_PATH=/data/ivy-wallet.db

      # Authentication Configuration
      - AUTH_ENABLED=true
      - JWT_SECRET=change-this-to-a-secure-random-string-in-production
      - LOCAL_AUTH_ENABLED=true
      - ALLOW_REGISTRATION=true
      - INITIAL_ADMIN_PASSWORD=admin123
      - ADMIN_EMAIL=admin@ivy.local
      - DEV_LOGIN_ENABLED=false

      # --- OIDC / SSO Configuration (Keycloak, Authentik, Authelia, Google, etc.) ---
      # - OIDC_ENABLED=true
      # - OIDC_ISSUER_URL=https://auth.example.com/application/o/ivy-wallet/
      # - OIDC_CLIENT_ID=ivy-wallet-client-id
      # - OIDC_CLIENT_SECRET=ivy-wallet-client-secret
      # - OIDC_REDIRECT_URL=https://wallet.example.com/api/auth/oidc/callback
      # - OIDC_PROVIDER_NAME=Single Sign-On (OIDC)
      # - OIDC_SCOPES=openid profile email
      
      # --- For PostgreSQL (uncomment if using PostgreSQL) ---
      # - DB_TYPE=postgres
      # - DATABASE_URL=postgres://ivy:secret@postgres:5432/ivy_wallet?sslmode=disable
      
      # --- For MariaDB / MySQL (uncomment if using MariaDB) ---
      # - DB_TYPE=mariadb
      # - DATABASE_URL=ivy:secret@tcp(mariadb:3306)/ivy_wallet?parseTime=true&charset=utf8mb4
    volumes:
      - ivy-data:/data

  # --- Optional PostgreSQL Service ---
  # postgres:
  #   image: postgres:17-alpine
  #   container_name: ivy-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ivy
  #     POSTGRES_PASSWORD: secret
  #     POSTGRES_DB: ivy_wallet
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

  # --- Optional MariaDB Service ---
  # mariadb:
  #   image: mariadb:11-jammy
  #   container_name: ivy-mariadb
  #   restart: unless-stopped
  #   environment:
  #     MARIADB_USER: ivy
  #     MARIADB_PASSWORD: secret
  #     MARIADB_DATABASE: ivy_wallet
  #     MARIADB_RANDOM_ROOT_PASSWORD: "1"
  #   volumes:
  #     - mariadb-data:/var/lib/mysql

volumes:
  ivy-data:
    driver: local
  # postgres-data:
  # mariadb-data:
